<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burza dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --good: #006300; --critical: #d03b3b; --warning: #fab219;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --good: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --good: #0ca30c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 16px; max-width: 1280px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; }
.meta { color: var(--ink-2); font-size: 13px; }
nav { display: flex; gap: 4px; padding: 0 16px; max-width: 1280px; margin: 0 auto; border-bottom: 1px solid var(--border); }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-2);
  padding: 10px 14px; font: inherit; cursor: pointer; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
main { max-width: 1280px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 20px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
.tile .sub { color: var(--muted); font-size: 12px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 10px;
  border-radius: 999px; border: 1px solid var(--border); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.warn { border-left: 3px solid var(--warning); padding: 8px 12px; background: var(--surface); margin-bottom: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--ink-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 240px; }
.pos::before { content: "▲ "; color: var(--good); font-size: 10px; }
.neg::before { content: "▼ "; color: var(--critical); font-size: 10px; }
.chart { position: relative; }
.chart svg { width: 100%; height: 280px; display: block; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); display: none; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
.grid2 > * { min-width: 0; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
dt { color: var(--ink-2); }
dd { margin: 0; }
.empty { color: var(--muted); padding: 8px 0; }
button.theme { background: var(--surface); border: 1px solid var(--border); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Burza – AI obchodní studie</h1>
    <div class="meta" id="meta">Načítám…</div>
  </div>
  <button class="theme" id="theme" type="button">Světlý / tmavý režim</button>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"></main>

<script src="/chart.js"></script>
<script>

let data = null;
let tab = (() => { try { return localStorage.getItem("burza-tab") || "0"; } catch { return "0"; } })();

$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};

function tile(label, value, sub = "", cls = "") {
  return `<div class="tile"><div class="label">${label}</div><div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
}

function table(cols, rows, empty = "Zatím nic") {
  if (!rows || !rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? "num" : ""} ${c.wrap ? "wrap" : ""} ${c.cls ? c.cls(r) : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function statusBadge(s) {
  if (s.error) return `<span class="status"><span class="dot" style="background:var(--muted)"></span>bez dat</span>`;
  if (s.kill_switch) return `<span class="status"><span class="dot" style="background:var(--critical)"></span>⛔ kill switch</span>`;
  if (s.risk && s.risk.halted) return `<span class="status"><span class="dot" style="background:var(--critical)"></span>⛔ zastaveno (limit 15 %)</span>`;
  if (s.risk && s.risk.daily_blocked) return `<span class="status"><span class="dot" style="background:var(--warning)"></span>⚠ denní limit</span>`;
  return s.running ? `<span class="status"><span class="dot" style="background:var(--good)"></span>✓ běží (${s.heartbeat_age_s} s)</span>`
                   : `<span class="status"><span class="dot" style="background:var(--warning)"></span>⚠ agent neběží</span>`;
}

function studyView(s, idx) {
  if (s.error) return `<div class="card"><h2>${esc(s.name)}</h2><p>${esc(s.error)}</p>${methodologyCard(s)}</div>`;
  const m = s.metrics;
  let html = `<div class="card" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center">
    <div><b>${esc(s.name)}</b> · ${esc(s.strategy)} · režim ${esc(s.mode)}</div>${statusBadge(s)}</div>`;
  if (m.estimated_pnl_trades) html += `<div class="warn">${m.estimated_pnl_trades} obchodů má zatím odhadnuté P/L – přesné číslo se doplní z historie eToro.</div>`;
  html += `<div class="tiles">
    ${tile("Počáteční kapitál", usd(m.initial))}
    ${tile("Aktuální kapitál", usd(m.current), pct(m.return_pct), "")}
    ${tile("Realizovaný P/L", usd(m.realized), "", signCls(m.realized))}
    ${tile("Nerealizovaný P/L", usd(m.unrealized), "", signCls(m.unrealized))}
    ${tile("Max. drawdown", pct(-m.max_dd_pct))}
    ${tile("Win rate", m.win_rate_pct == null ? "–" : fmt(m.win_rate_pct, 1) + " %", m.trades + " obchodů")}
    ${tile("Profit factor", fmt(m.profit_factor))}
    ${tile("Sharpe (denní, p.a.)", fmt(m.sharpe))}
    ${tile("Náklady", usd(m.costs))}
    ${tile("Odmítnuté signály", s.rejected_count)}
    ${tile("S&P 500 (SPY) – kup a drž", pct(s.bench_return_pct), "za stejné období",
           signCls(s.bench_return_pct))}
    ${tile("Nasdaq 100 (QQQ) – kup a drž", pct(s.bench2_return_pct), "za stejné období",
           signCls(s.bench2_return_pct))}
  </div>
  <div class="card"><h2>Vývoj kapitálu (USD)</h2><div class="chart" id="eq${idx}"></div></div>
  <div class="grid2">
    <div class="card"><h2>Otevřené pozice</h2>${table([
      {h: "Symbol", f: r => esc(r.symbol)}, {h: "Ks", num: 1, f: r => fmt(r.units, 4)},
      {h: "Nákup", num: 1, f: r => fmt(r.open_price)}, {h: "Cena", num: 1, f: r => fmt(r.last_price)},
      {h: "Stop", num: 1, f: r => fmt(r.stop)}, {h: "Cíl", num: 1, f: r => fmt(r.target)},
      {h: "P/L", num: 1, f: r => usd(r.unrealized), cls: r => signCls(r.unrealized)}], s.open_positions, "Žádné otevřené pozice")}</div>
    <div class="card"><h2>Denní výnos</h2>${table([
      {h: "Den", f: r => r.date}, {h: "Kapitál", num: 1, f: r => usd(r.equity)},
      {h: "Den", num: 1, f: r => pct(r.ret_pct), cls: r => signCls(r.ret_pct)},
      {h: "Kumulativně", num: 1, f: r => pct(r.cum_pct), cls: r => signCls(r.cum_pct)}], m.daily.slice().reverse().slice(0, 30))}</div>
  </div>
  <div class="card"><h2>Historie obchodů</h2>${table([
    {h: "Zavřeno", f: r => dt(r.close_ts)}, {h: "Symbol", f: r => esc(r.symbol)},
    {h: "Nákup", num: 1, f: r => fmt(r.open_price)}, {h: "Prodej", num: 1, f: r => fmt(r.close_price)},
    {h: "Ks", num: 1, f: r => fmt(r.units, 4)}, {h: "P/L", num: 1, f: r => usd(r.pnl), cls: r => signCls(r.pnl)},
    {h: "Náklady", num: 1, f: r => usd(r.costs)}, {h: "Zdroj P/L", f: r => esc(r.pnl_source)},
    {h: "Důvod", f: r => esc(r.close_reason)}], s.trades)}</div>`;
  if (s.id === "B") html += `<div class="card"><h2>Posouzení zpráv a makra (posledních 50)</h2>${table([
    {h: "Čas", f: r => dt(r.ts)}, {h: "Symbol", f: r => esc(r.symbol)},
    {h: "Výsledek", f: r => r.error ? "⚠ chyba" : r.take ? "✓ obchod" : "✕ přeskočit"},
    {h: "Jistota", num: 1, f: r => fmt(r.confidence)}, {h: "Velikost", num: 1, f: r => r.size_factor == null ? "–" : "×" + r.size_factor},
    {h: "Zdůvodnění / zdroje", wrap: 1, f: r => aiText(r)}], s.ai_decisions)}</div>`;
  html += `<div class="card"><h2>Odmítnuté signály</h2>${table([
    {h: "Čas", f: r => dt(r.ts)}, {h: "Symbol", f: r => esc(r.symbol)}, {h: "Vstup", num: 1, f: r => fmt(r.entry)},
    {h: "Stop", num: 1, f: r => fmt(r.stop)}, {h: "Důvod odmítnutí", wrap: 1, f: r => esc(r.decision)}], s.rejected)}</div>
  ${methodologyCard(s)}
  <div class="card"><h2>Události agenta</h2>${table([
    {h: "Čas", f: r => dt(r.ts)}, {h: "Úroveň", f: r => esc(r.level)}, {h: "Typ", f: r => esc(r.kind)},
    {h: "Zpráva", wrap: 1, f: r => esc(r.message)}], s.events)}</div>`;
  return html;
}

function aiText(r) {
  if (r.error) return esc(r.error);
  try {
    const d = JSON.parse(r.decision || "{}");
    if (d.pravidlo) return "Pravidlo: " + esc(d.pravidlo);
    const items = (d.key_items || []).map(i => `<div style="color:var(--ink-2)">· ${esc(i.source)}, ${esc(i.published_at)}: ${esc(i.headline)} (${esc(i.impact)})</div>`).join("");
    return `${esc(d.rationale)}<div style="color:var(--muted)">kontext: ${esc(d.context_bias)}, riziko událostí: ${esc(d.event_risk)}, v ceně: ${esc(d.priced_in)}</div>${items}`;
  } catch { return "–"; }
}

const LABELS = {studie: "Studie", rezim: "Režim", strategie: "Strategie", data: "Data", zpravy: "Zprávy",
  start: "Start", kapital_czk: "Kapitál (Kč)", kurz_usdczk: "Kurz USD/CZK", kapital_usd: "Kapitál (USD)",
  naklady: "Náklady", ocenovani: "Oceňování", riziko: "Riziko", benchmark: "Benchmark"};
function methodologyCard(s) {
  return `<div class="card"><h2>Metodika</h2><dl>${Object.entries(s.methodology || {}).map(([k, v]) =>
    `<dt>${esc(LABELS[k] || k)}</dt><dd>${esc(v ?? "–")}</dd>`).join("")}</dl></div>`;
}

function compareView() {
  const st = data.studies;
  let html = data.comparability.map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("");
  html += `<div class="card"><h2>Kumulativní výnos (%) – studie vs. kup a drž S&amp;P 500 a Nasdaq 100</h2><div class="legend" id="lg"></div><div class="chart" id="cmp"></div></div>`;
  html += `<div class="card"><h2>Přehled</h2>${table([
    {h: "Studie", f: s => esc(s.name)}, {h: "Strategie", f: s => esc(s.strategy)},
    {h: "Kapitál", num: 1, f: s => s.metrics ? usd(s.metrics.current) : "–"},
    {h: "Výnos", num: 1, f: s => s.metrics ? pct(s.metrics.return_pct) : "–", cls: s => s.metrics ? signCls(s.metrics.return_pct) : ""},
    {h: "Max DD", num: 1, f: s => s.metrics ? pct(-s.metrics.max_dd_pct) : "–"},
    {h: "Obchodů", num: 1, f: s => s.metrics ? s.metrics.trades : "–"},
    {h: "Win rate", num: 1, f: s => s.metrics && s.metrics.win_rate_pct != null ? fmt(s.metrics.win_rate_pct, 1) + " %" : "–"},
    {h: "Profit factor", num: 1, f: s => s.metrics ? fmt(s.metrics.profit_factor) : "–"},
    {h: "Sharpe", num: 1, f: s => s.metrics ? fmt(s.metrics.sharpe) : "–"},
    {h: "Náklady", num: 1, f: s => s.metrics ? usd(s.metrics.costs) : "–"},
    {h: "Odmítnuté", num: 1, f: s => s.rejected_count ?? "–"},
    {h: "S&P 500 stejně dlouho", num: 1, f: s => pct(s.bench_return_pct), cls: s => signCls(s.bench_return_pct)},
    {h: "Nasdaq 100 stejně dlouho", num: 1, f: s => pct(s.bench2_return_pct), cls: s => signCls(s.bench2_return_pct)}], st)}</div>`;
  html += `<div class="grid2">${st.map(methodologyCard).join("")}</div>`;
  return html;
}

function render() {
  const names = [...data.studies.map(s => s.name), "Porovnání"];
  if (+tab >= names.length) tab = "0";
  $("#tabs").innerHTML = names.map((n, i) => `<button role="tab" aria-selected="${String(i) === tab}" data-i="${i}">${esc(n)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    tab = b.dataset.i; try { localStorage.setItem("burza-tab", tab); } catch {} render();
  });
  $("#meta").textContent = `Aktualizováno ${dt(data.generated)} · trh ${data.market_open ? "otevřený" : "zavřený"} · obnova každých 60 s`;
  const i = +tab;
  if (i < data.studies.length) {
    const s = data.studies[i];
    $("#main").innerHTML = studyView(s, i);
    if (s.series) lineChart($("#eq" + i), [{name: s.name, color: SERIES[i % 2],
      points: s.series.map(p => ({t: Date.parse(p.t), v: p.equity}))}], "USD");
  } else {
    $("#main").innerHTML = compareView();
    const series = data.studies.filter(s => s.series).map((s, k) => ({name: s.name, color: SERIES[data.studies.indexOf(s) % 2],
      points: s.series.map(p => ({t: Date.parse(p.t), v: p.ret_pct}))}));
    for (const [key, label, color] of [["bench_pct", "S&P 500 (SPY)", SERIES[2]], ["bench2_pct", "Nasdaq 100 (QQQ)", SERIES[3]]]) {
      const src = data.studies.find(s => s.series && s.series.some(p => p[key] != null));
      if (src) series.push({name: label, color,
        points: src.series.filter(p => p[key] != null).map(p => ({t: Date.parse(p.t), v: p[key]}))});
    }
    $("#lg").innerHTML = series.map(s => `<span style="--c:${s.color}">${esc(s.name)}</span>`).join("");
    lineChart($("#cmp"), series, "%");
  }
}

async function load() {
  try {
    const r = await fetch("/api/data", {cache: "no-store"});
    data = await r.json();
    render();
  } catch (e) {
    $("#meta").textContent = "Dashboard nemá spojení se serverem: " + e;
  }
}
load();
setInterval(load, 60000);
addEventListener("resize", () => data && render());
</script>
</body>
</html>
